          <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Music | Premium Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .player-glass { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(30px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-hero { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: white; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .card-hover:hover { transform: translateY(-4px); }
        .heart-active { color: #ec4899; fill: #ec4899; }
    </style>
</head>
<body class="bg-black text-white font-sans overflow-hidden h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 glass p-6 flex flex-col gap-8 z-10">
        <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">NEBULA</h1>
        <nav class="space-y-4">
            <button onclick="filterView('all')" class="w-full text-left py-2 hover:text-pink-400 transition">All Tracks</button>
            <button onclick="filterView('liked')" class="w-full text-left py-2 hover:text-pink-400 transition">Liked Songs</button>
        </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto scroll-smooth">
        <div class="gradient-hero p-12 pb-24">
            <h2 class="text-5xl font-black mb-4">Welcome Back, User</h2>
            <input type="text" id="search" placeholder="Search tracks..." class="glass w-full max-w-md px-6 py-3 rounded-full outline-none focus:ring-2 ring-pink-500">
        </div>

        <div id="grid" class="p-8 grid grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dynamic Injection -->
        </div>
    </main>

    <!-- Player -->
    <footer class="fixed bottom-0 w-full player-glass p-4 px-8 flex items-center justify-between">
        <div class="flex items-center gap-4 w-1/4">
            <div id="p-img" class="w-12 h-12 bg-gray-700 rounded-lg"></div>
            <div>
                <p id="p-title" class="font-bold text-sm">Select a track</p>
            </div>
        </div>
        <div class="w-2/4 flex flex-col items-center gap-2">
            <div class="flex gap-4">
                <button onclick="togglePlay()" class="text-2xl hover:scale-110 transition">▶</button>
            </div>
            <input type="range" id="progress" value="0" class="w-full">
        </div>
        <div class="w-1/4 text-right font-mono text-sm" id="timer">0:00</div>
    </footer>

    <script>
        const tracks = [
            { id: 1, title: 'Midnight City', artist: 'Synthwave', art: 'bg-blue-500' },
            { id: 2, title: 'Neon Dreams', artist: 'Lo-Fi', art: 'bg-purple-500' },
            { id: 3, title: 'Cyber Pulse', artist: 'Techno', art: 'bg-pink-500' },
            { id: 4, title: 'Analog Sky', artist: 'Ambient', art: 'bg-indigo-500' }
        ];

        let liked = JSON.parse(localStorage.getItem('liked')) || [];
        let currentFilter = 'all';

        function init() {
            if (!localStorage.getItem('session')) window.location.href = 'login.html';
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            tracks.filter(t => currentFilter === 'all' || liked.includes(t.id)).forEach(t => {
                grid.innerHTML += `
                    <div class="card-hover group relative rounded-2xl p-4 glass transition-all cursor-pointer">
                        <div class="${t.art} h-40 w-full rounded-xl mb-4"></div>
                        <h3 class="font-bold">${t.title}</h3>
                        <button onclick="toggleLike(${t.id})" class="absolute top-6 right-6 p-2 rounded-full glass ${liked.includes(t.id) ? 'heart-active' : ''}">♥</button>
                        <button onclick="playTrack('${t.title}', '${t.art}')" class="absolute inset-0 m-auto w-12 h-12 bg-white text-black rounded-full opacity-0 group-hover:opacity-100 transition">▶</button>
                    </div>
                `;
            });
        }

        function toggleLike(id) {
            liked = liked.includes(id) ? liked.filter(i => i !== id) : [...liked, id];
            localStorage.setItem('liked', JSON.stringify(liked));
            render();
        }

        function filterView(v) { currentFilter = v; render(); }

        function playTrack(title, art) {
            document.getElementById('p-title').innerText = title;
            document.getElementById('p-img').className = `w-12 h-12 ${art} rounded-lg`;
            let time = 0;
            setInterval(() => {
                time++;
                document.getElementById('progress').value = time;
                document.getElementById('timer').innerText = `0:${time.toString().padStart(2, '0')}`;
            }, 1000);
        }

        document.getElementById('search').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('#grid > div').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(val) ? 'block' : 'none';
            });
        };

        init();
    </script>
</body>
</html>
        </body>
        </html>
