<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // SYSTEM_AUTH</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f0ea; 
            --border-color: #111;
            --accent-primary: #ff3e00; 
            --accent-secondary: #0055ff; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background-color: var(--bg-color); 
            color: #111; 
            font-family: 'Work Sans', sans-serif;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: -1px -1px;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .brutal-box {
            background: #fff;
            border: 4px solid var(--border-color);
            box-shadow: 12px 12px 0px var(--border-color);
            transition: all 0.2s ease;
            position: relative;
        }

        .brutal-input {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 0;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        .brutal-input:focus {
            outline: none;
            box-shadow: 4px 4px 0px var(--accent-secondary);
            transform: translate(-2px, -2px);
        }

        .brutal-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-primary);
            color: #fff;
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--border-color);
            text-transform: uppercase;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
            transition: all 0.1s;
            cursor: pointer;
            margin-top: 10px;
        }
        .brutal-btn:active {
            box-shadow: 0px 0px 0px var(--border-color);
            transform: translate(6px, 6px);
        }

        .tab-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .tab-btn {
            flex: 1; text-align: left; padding-bottom: 8px;
            background: transparent; border: none; border-bottom: 4px solid transparent;
            font-family: 'Work Sans', sans-serif; font-weight: 800; font-size: 1.1rem;
            text-transform: uppercase; color: #888; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { border-bottom-color: var(--border-color); color: var(--accent-primary); }

        label { display: block; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }

        h1 { font-size: 4rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; line-height: 1; margin-bottom: 5px; }
        .subtitle { font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight: 700; border-bottom: 4px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; display: block; }

        #toast {
            position: fixed; top: 20px; right: 20px;
            background: #fff; border: 4px solid var(--border-color); box-shadow: 6px 6px 0px var(--border-color);
            padding: 15px 20px; font-weight: 800; font-family: 'Space Mono', monospace;
            transform: translateX(150%); transition: transform 0.3s ease; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="toast">SYSTEM_MESSAGE</div>

    <div class="brutal-box" style="width: 100%; max-width: 450px; padding: 40px;">
        <h1>Aura.</h1>
        <span class="subtitle">TOLLYWOOD_VAULT</span>

        <div class="tab-container">
            <button onclick="switchTab('login')" id="tab-login" class="tab-btn active">Log In</button>
            <button onclick="switchTab('register')" id="tab-register" class="tab-btn">Sign Up</button>
        </div>

        <form id="authForm">
            <div id="nameField" style="display: none;">
                <label>Designation</label>
                <input type="text" id="name" class="brutal-input" placeholder="YOUR NAME">
            </div>
            <div>
                <label>Identity</label>
                <input type="email" id="email" required class="brutal-input" placeholder="EMAIL@DOMAIN.COM">
            </div>
            <div>
                <label>Passkey</label>
                <input type="password" id="password" required class="brutal-input" placeholder="••••••••">
            </div>
            <button type="submit" id="submitBtn" class="brutal-btn">Access System</button>
        </form>
    </div>

    <script>
        const DB_KEY = 'aura_brutal_db';
        const SESSION_KEY = 'aura_brutal_session';
        let mode = 'login';

        if (!localStorage.getItem(DB_KEY)) {
            localStorage.setItem(DB_KEY, JSON.stringify({
                users: [{ name: 'System Admin', email: 'admin@aura.com', pass: 'admin123', role: 'admin' }],
                songs: [
                    { id: 1, title: 'Naatu Naatu', artist: 'Kaala Bhairava, Rahul S.', genre: 'Mass', duration: '3:34', cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&q=80' },
                    { id: 2, title: 'Butta Bomma', artist: 'Armaan Malik', genre: 'Melody', duration: '3:17', cover: 'https://images.unsplash.com/photo-1493225457224-b1eb21f5756c?w=400&q=80' },
                    { id: 3, title: 'Samajavaragamana', artist: 'Sid Sriram', genre: 'Melody', duration: '3:42', cover: 'https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=400&q=80' },
                    { id: 4, title: 'Oo Antava Mava', artist: 'Indravathi Chauhan', genre: 'Dance', duration: '3:43', cover: 'https://images.unsplash.com/photo-1546367564-ade1880f8921?w=400&q=80' },
                    { id: 5, title: 'Srivalli', artist: 'Sid Sriram', genre: 'Melody', duration: '3:44', cover: 'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=400&q=80' }
                ]
            }));
        }

        const showToast = (msg, isErr = false) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.backgroundColor = isErr ? 'var(--accent-primary)' : 'var(--accent-secondary)';
            t.style.color = '#fff';
            t.style.transform = 'translateX(0)';
            setTimeout(() => t.style.transform = 'translateX(150%)', 3000);
        };

        const switchTab = (m) => {
            mode = m;
            document.getElementById('nameField').style.display = m === 'register' ? 'block' : 'none';
            document.getElementById('name').required = m === 'register';
            document.getElementById('tab-login').className = `tab-btn ${m === 'login' ? 'active' : ''}`;
            document.getElementById('tab-register').className = `tab-btn ${m === 'register' ? 'active' : ''}`;
            document.getElementById('submitBtn').textContent = m === 'login' ? 'Access System' : 'Register Entity';
        };

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const db = JSON.parse(localStorage.getItem(DB_KEY));

            if (mode === 'register') {
                const name = document.getElementById('name').value.trim();
                if (db.users.find(u => u.email === email)) return showToast('IDENTITY EXISTS', true);
                
                db.users.push({ name, email, pass, role: 'user' });
                localStorage.setItem(DB_KEY, JSON.stringify(db));
                showToast('REGISTRATION LOGGED');
                setTimeout(() => switchTab('login'), 1000);
            } else {
                const user = db.users.find(u => u.email === email && u.pass === pass);
                if (!user) return showToast('ACCESS DENIED', true);
                
                localStorage.setItem(SESSION_KEY, JSON.stringify(user));
                
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'user.html';
                }
            }
        });
    </script>
</body>
</html>
