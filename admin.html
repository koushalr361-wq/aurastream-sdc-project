<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; --card-bg: #1c1c1e; --border: rgba(255,255,255,0.1);
            --accent: #fa243c; --text-main: #ffffff; --text-muted: rgba(235, 235, 245, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 40px; }

        .dashboard { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        header { max-width: 1200px; margin: 0 auto 40px auto; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        .logout-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background: rgba(255,255,255,0.1); color: #ff453a; border-color: #ff453a; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 30px; border: 1px solid var(--border); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--text-main); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-box { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-val { font-size: 36px; font-weight: 700; margin-bottom: 5px; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

        .app-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; padding: 14px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 15px; transition: 0.2s; }
        .app-input:focus { outline: none; border-color: var(--accent); }
        .app-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .app-btn:hover { background: #ff3b50; }

        .table-wrap { height: 600px; overflow-y: auto; }
        .table-wrap::-webkit-scrollbar { width: 6px; }
        .table-wrap::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { font-size: 12px; color: var(--text-muted); font-weight: 500; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        td { padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .td-cover { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; margin-right: 15px; vertical-align: middle; }
        .td-title { font-weight: 600; color: #fff; margin-bottom: 4px; }
        .td-artist { color: var(--text-muted); font-size: 12px; }
        .badge { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; }
        
        .del-btn { background: transparent; border: 1px solid #ff453a; color: #ff453a; font-size: 12px; font-weight: 500; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: 0.2s; }
        .del-btn:hover { background: rgba(255,69,58,0.1); }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Aura Connect</h1>
            <p style="font-size: 14px; color: var(--text-muted); margin-top: 5px;" id="adminLabel">Admin Workspace</p>
        </div>
        <button onclick="logout()" class="logout-btn">Sign Out</button>
    </header>

    <div class="dashboard">
        
        <div class="card">
            <div class="stat-grid">
                <div class="stat-box"><div class="stat-val" id="uCount">0</div><div class="stat-label">Listeners</div></div>
                <div class="stat-box"><div class="stat-val" id="tCount">0</div><div class="stat-label">Tracks</div></div>
            </div>

            <h2 class="card-title">Upload Track</h2>
            <form id="addForm">
                <input type="text" id="iTitle" placeholder="Song Title" required class="app-input">
                <input type="text" id="iArtist" placeholder="Artist" required class="app-input">
                <input type="text" id="iAlbum" placeholder="Album Name" required class="app-input">
                <div style="display: flex; gap: 15px;">
                    <select id="iGenre" class="app-input" required>
                        <option value="" disabled selected>Genre</option>
                        <option>Melody</option><option>Mass</option><option>Dance</option><option>Folk</option>
                    </select>
                    <input type="text" id="iDur" placeholder="3:30" required class="app-input">
                </div>
                <input type="url" id="iCov" required class="app-input" placeholder="Artwork URL (High Res)">
                <button type="submit" class="app-btn">Publish to Library</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">Master Library</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Track Details</th><th>Album</th><th>Genre</th><th style="text-align: right;">Action</th></tr>
                    </thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const DB_KEY = 'aura_am_final_db';
        const SESSION_KEY = 'aura_am_final_session';

        const session = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (!session || session.role !== 'admin') window.location.href = 'login.html';
        document.getElementById('adminLabel').innerText = `Logged in as: ${session.name}`;

        const render = () => {
            const db = JSON.parse(localStorage.getItem(DB_KEY));
            document.getElementById('uCount').innerText = db.users.length;
            document.getElementById('tCount').innerText = db.songs.length;

            const tb = document.getElementById('tBody');
            tb.innerHTML = '';
            [...db.songs].reverse().forEach(s => {
                tb.innerHTML += `
                    <tr>
                        <td style="display: flex; align-items: center;">
                            <img src="${s.cover}" class="td-cover">
                            <div><div class="td-title">${s.title}</div><div class="td-artist">${s.artist}</div></div>
                        </td>
                        <td style="font-size: 13px; color: #ccc;">${s.album || 'Single'}</td>
                        <td><span class="badge">${s.genre}</span></td>
                        <td style="text-align: right;"><button onclick="del(${s.id})" class="del-btn">Delete</button></td>
                    </tr>
                `;
            });
        };

        document.getElementById('addForm').onsubmit = (e) => {
            e.preventDefault();
            const db = JSON.parse(localStorage.getItem(DB_KEY));
            db.songs.push({
                id: Date.now(), title: document.getElementById('iTitle').value,
                artist: document.getElementById('iArtist').value, album: document.getElementById('iAlbum').value,
                genre: document.getElementById('iGenre').value, duration: document.getElementById('iDur').value, cover: document.getElementById('iCov').value
            });
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            e.target.reset(); render();
        };

        window.del = (id) => {
            const db = JSON.parse(localStorage.getItem(DB_KEY));
            db.songs = db.songs.filter(s => s.id !== id);
            localStorage.setItem(DB_KEY, JSON.stringify(db)); render();
        };

        window.logout = () => {
            document.body.style.transition = "opacity 0.5s ease"; document.body.style.opacity = 0;
            setTimeout(() => { localStorage.removeItem(SESSION_KEY); window.location.href = 'login.html'; }, 500);
        };

        render();
    </script>
</body>
</html>
