<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // COMMAND</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #e5e5e5; --border: #000; --primary: #0055ff; --danger: #ff3e00; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--border); font-family: 'Work Sans', sans-serif;
            background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;
            padding: 40px; min-height: 100vh;
        }

        .b-box { background: #fff; border: 4px solid var(--border); box-shadow: 8px 8px 0px var(--border); }
        .b-input { width: 100%; border: 3px solid var(--border); font-family: 'Space Mono', monospace; padding: 12px; font-weight: 700; transition: 0.2s; margin-bottom: 15px; }
        .b-input:focus { outline: none; box-shadow: 4px 4px 0px var(--primary); transform: translate(-2px, -2px); }
        
        .b-btn { border: 4px solid var(--border); font-weight: 900; text-transform: uppercase; transition: 0.1s; cursor: pointer; padding: 12px 24px; font-family: 'Space Mono', monospace; }
        .b-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #000 !important; }

        .layout-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; max-width: 1400px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; background: #ffe600; padding: 30px; margin-bottom: 40px; max-width: 1400px; margin: 0 auto 40px auto; }
        h1 { font-size: 3rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; }
        .admin-id { font-family: 'Space Mono', monospace; font-weight: 700; background: #fff; border: 3px solid #000; padding: 5px 10px; display: inline-block; margin-top: 10px; }

        .metrics-box { background: var(--primary); color: #fff; padding: 30px; margin-bottom: 40px; }
        .metrics-title { font-family: 'Space Mono', monospace; font-weight: 700; border-bottom: 4px solid #fff; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; }
        .metric-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .metric-label { font-weight: 800; text-transform: uppercase; }
        .metric-val { font-size: 3rem; font-weight: 900; line-height: 1; }

        .form-box { padding: 30px; }
        .form-title { font-family: 'Space Mono', monospace; font-weight: 700; border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; }
        .row-flex { display: flex; gap: 15px; }

        .table-box { height: 750px; display: flex; flex-direction: column; overflow: hidden; }
        .table-header { padding: 30px; border-bottom: 4px solid #000; background: #f4f4f4; }
        .table-header h2 { font-weight: 900; font-size: 1.5rem; text-transform: uppercase; }
        
        .table-content { flex: 1; overflow-y: auto; padding: 30px; background: #fff; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; }
        th { font-family: 'Space Mono', monospace; text-transform: uppercase; border-bottom: 4px solid #000; padding-bottom: 15px; }
        td { border-bottom: 3px solid #000; padding: 15px 0; font-weight: 700; text-transform: uppercase; }
        .td-id { font-family: 'Space Mono', monospace; color: #888; }
        .td-artist { color: #666; font-size: 0.8rem; }
        
        .table-content::-webkit-scrollbar { width: 8px; border-left: 3px solid #000; }
        .table-content::-webkit-scrollbar-thumb { background: #000; }
    </style>
</head>
<body>

    <header class="b-box">
        <div>
            <h1>Command_</h1>
            <div class="admin-id" id="adminLabel">ID: UNKNOWN</div>
        </div>
        <button onclick="logout()" class="b-btn" style="background: var(--danger); color: #fff; shadow-[4px_4px_0px_#000];">TERMINATE</button>
    </header>

    <div class="layout-grid">
        
        <!-- LEFT COL -->
        <div>
            <div class="b-box metrics-box">
                <h2 class="metrics-title">DATA_METRICS</h2>
                <div class="metric-row">
                    <span class="metric-label">Entities</span>
                    <span class="metric-val" id="uCount">0</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Audio Files</span>
                    <span class="metric-val" id="tCount">0</span>
                </div>
            </div>

            <div class="b-box form-box">
                <h2 class="form-title">INJECT_AUDIO</h2>
                <form id="addForm">
                    <input type="text" id="iTitle" placeholder="TITLE" required class="b-input">
                    <input type="text" id="iArtist" placeholder="ARTIST" required class="b-input">
                    <div class="row-flex">
                        <select id="iGenre" class="b-input">
                            <option>Mass</option><option>Melody</option><option>Dance</option>
                        </select>
                        <input type="text" id="iDur" placeholder="MM:SS" required class="b-input">
                    </div>
                    <input type="url" id="iCov" placeholder="IMG_URL" required class="b-input">
                    <button type="submit" class="b-btn" style="width: 100%; background: #000; color: #fff; padding: 15px; box-shadow: 4px 4px 0px var(--primary);">EXECUTE</button>
                </form>
            </div>
        </div>

        <!-- RIGHT COL -->
        <div class="b-box table-box">
            <div class="table-header">
                <h2>Global_Registry</h2>
            </div>
            <div class="table-content">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Title</th><th>Artist</th><th>Action</th></tr>
                    </thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const DB_KEY = 'aura_brutal_db';
        const SESSION_KEY = 'aura_brutal_session';

        // Route Guard
        const session = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (!session || session.role !== 'admin') {
            window.location.href = 'login.html';
        }

        document.getElementById('adminLabel').innerText = `OP: ${session.name}`;

        const render = () => {
            const db = JSON.parse(localStorage.getItem(DB_KEY));
            document.getElementById('uCount').innerText = db.users.length;
            document.getElementById('tCount').innerText = db.songs.length;

            const tb = document.getElementById('tBody');
            tb.innerHTML = '';
            [...db.songs].reverse().forEach(s => {
                tb.innerHTML += `
                    <tr>
                        <td class="td-id">#${s.id}</td>
                        <td>${s.title}</td>
                        <td class="td-artist">${s.artist}</td>
                        <td>
                            <button onclick="del(${s.id})" class="b-btn" style="background: var(--danger); color: #fff; padding: 5px 10px; font-size: 0.8rem; box-shadow: 2px 2px 0px #000;">DEL</button>
                        </td>
                    </tr>
                `;
            });
        };

        document.getElementById('addForm').onsubmit = (e) => {
            e.preventDefault();
            const db = JSON.parse(localStorage.getItem(DB_KEY));
            db.songs.push({
                id: Date.now(),
                title: document.getElementById('iTitle').value,
                artist: document.getElementById('iArtist').value,
                genre: document.getElementById('iGenre').value,
                duration: document.getElementById('iDur').value,
                cover: document.getElementById('iCov').value
            });
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            e.target.reset();
            render();
        };

        window.del = (id) => {
            const db = JSON.parse(localStorage.getItem(DB_KEY));
            db.songs = db.songs.filter(s => s.id !== id);
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            render();
        };

        window.logout = () => {
            localStorage.removeItem(SESSION_KEY);
            window.location.href = 'login.html';
        };

        render();
    </script>
</body>
</html>
