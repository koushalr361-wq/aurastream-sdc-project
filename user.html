<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // PLAYER</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --border: #111; --primary: #ff3e00; --bg: #f4f0ea; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); color: var(--border); font-family: 'Work Sans', sans-serif;
            overflow: hidden; display: flex; flex-direction: column; height: 100vh;
        }
        
        .b-border { border: 4px solid var(--border); }
        .b-box { background: #fff; border: 4px solid var(--border); box-shadow: 6px 6px 0px var(--border); transition: 0.1s; }
        .b-btn { font-family: 'Space Mono', monospace; font-weight: 700; text-transform: uppercase; border: 3px solid var(--border); transition: 0.1s; cursor: pointer; }
        .b-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 transparent !important; }
        
        .workspace { display: flex; flex: 1; overflow: hidden; }

        .sidebar { width: 280px; background: #fff; border-right: 6px solid var(--border); display: flex; flex-direction: column; }
        .brand-box { padding: 30px; border-bottom: 4px solid var(--border); background: #ffe600; }
        .brand-box h1 { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; }

        .nav-btn {
            display: block; width: 100%; text-align: left; padding: 20px 30px;
            font-weight: 800; text-transform: uppercase; border-bottom: 3px solid var(--border);
            background: transparent; cursor: pointer; transition: 0.2s; font-size: 1rem; color: #666;
        }
        .nav-btn:hover, .nav-btn.active { background: var(--border); color: #fff; }

        .user-box { padding: 30px; border-top: 4px solid var(--border); background: #f4f4f4; margin-top: auto; }
        .user-id { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.9rem; margin-bottom: 15px; }

        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { padding: 40px; display: flex; justify-content: space-between; align-items: flex-end; }
        .view-title { font-size: 5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; line-height: 1; }
        .search-input {
            padding: 15px; width: 300px; text-transform: uppercase; font-weight: 800; font-size: 1rem;
            border: 4px solid var(--border); box-shadow: 4px 4px 0px var(--border); outline: none;
        }
        .search-input:focus { box-shadow: 4px 4px 0px #0055ff; }

        .grid-wrap { flex: 1; overflow-y: auto; padding: 0 40px 40px 40px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        
        .card { background: #fff; border: 4px solid var(--border); padding: 15px; display: flex; flex-direction: column; transition: 0.2s; cursor: pointer; }
        .card:hover { background: #0055ff; color: #fff; transform: translateY(-5px); box-shadow: 8px 8px 0px var(--border); }
        .card-img-box { width: 100%; aspect-ratio: 1; border: 3px solid var(--border); margin-bottom: 15px; background: #eee; overflow: hidden; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(120%); transition: 0.2s; }
        .card:hover .card-img-box img { filter: grayscale(0%); }
        
        .card-title { font-weight: 900; font-size: 1.2rem; text-transform: uppercase; line-height: 1.1; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-artist { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.8rem; margin-bottom: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .card-bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
        
        .css-heart {
            width: 15px; height: 15px; background-color: transparent; transform: rotate(-45deg); position: relative; border: 2px solid currentColor; margin-top: 5px;
        }
        .css-heart::before, .css-heart::after {
            content: ""; position: absolute; width: 15px; height: 15px; background-color: transparent; border: 2px solid currentColor; border-bottom: none; border-right: none; border-radius: 50%;
        }
        .css-heart::before { top: -9px; left: -2px; }
        .css-heart::after { top: -2px; left: 8px; }
        
        .css-heart.filled { background-color: currentColor; }
        .css-heart.filled::before, .css-heart.filled::after { background-color: currentColor; }

        .play-bar { background: #fff; border-top: 6px solid var(--border); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        
        .p-info { display: flex; align-items: center; gap: 20px; width: 30%; }
        .p-img-box { width: 70px; height: 70px; border: 4px solid var(--border); background: #000; }
        .p-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .p-title { font-weight: 900; text-transform: uppercase; font-size: 1.4rem; line-height: 1; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-artist { font-family: 'Space Mono', monospace; font-weight: 700; color: #666; font-size: 0.85rem; }

        .p-controls { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 600px; margin: 0 auto; }
        .p-btns { display: flex; gap: 20px; margin-bottom: 15px; }
        
        .icon-play { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 14px solid currentColor; margin-left: 4px; }
        .icon-pause { display: flex; gap: 4px; }
        .icon-pause div { width: 5px; height: 16px; background: currentColor; }
        
        .prog-container { width: 100%; display: flex; align-items: center; gap: 20px; font-family: 'Space Mono', monospace; font-weight: 700; }
        .prog-track { flex: 1; border: 3px solid var(--border); height: 24px; background: #eee; cursor: pointer; }
        .prog-fill { background: var(--primary); height: 100%; width: 0%; border-right: 3px solid var(--border); transition: width 0.1s linear; }

        .p-extra { width: 30%; display: flex; justify-content: flex-end; }
        
        .custom-scroll::-webkit-scrollbar { width: 12px; border-left: 3px solid var(--border); }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border); }
    </style>
</head>
<body>

    <div class="workspace">
        
        <aside class="sidebar">
            <div class="brand-box">
                <h1>AURA.</h1>
            </div>
            
            <nav style="flex: 1; overflow-y: auto;">
                <button onclick="app.setView('all')" id="nav-all" class="nav-btn active">01. Catalog</button>
                <button onclick="app.setView('liked')" id="nav-liked" class="nav-btn">02. Liked</button>
                <button class="nav-btn" style="color: #ccc; cursor: default;">03. Downloads</button>
                <button class="nav-btn" style="color: #ccc; cursor: default;">04. Playlists</button>
            </nav>

            <div class="user-box">
                <div class="user-id" id="uName">USER_ID</div>
                <button onclick="app.logout()" class="b-btn" style="width: 100%; padding: 12px; background: var(--primary); color: #fff; box-shadow: 4px 4px 0px #000;">LOGOUT</button>
            </div>
        </aside>

        <main class="main-area">
            <div class="top-bar">
                <h2 class="view-title" id="vTitle">CATALOG_</h2>
                <input type="text" id="search" placeholder="QUERY..." oninput="app.render()" class="search-input">
            </div>

            <div class="grid-wrap custom-scroll">
                <div class="grid-container" id="grid"></div>
            </div>
        </main>
    </div>

    <!-- PLAYER -->
    <footer class="play-bar">
        
        <div class="p-info">
            <div class="p-img-box"><img id="pImg" src="" style="display: none;"></div>
            <div style="min-width: 0;">
                <div class="p-title" id="pTitle">NO_DATA</div>
                <div class="p-artist" id="pArt">AWAITING_INPUT</div>
            </div>
        </div>

        <div class="p-controls">
            <div class="p-btns">
                <button onclick="app.skip(-1)" class="b-btn" style="padding: 5px 15px; background: #fff; box-shadow: 4px 4px 0px #000;">&lt;&lt;</button>
                <button onclick="app.togglePlay()" id="playBtn" class="b-btn" style="padding: 10px 30px; background: #000; color: #fff; box-shadow: 4px 4px 0px #0055ff; display: flex; align-items: center; justify-content: center; width: 100px;">
                    <div class="icon-play"></div>
                </button>
                <button onclick="app.skip(1)" class="b-btn" style="padding: 5px 15px; background: #fff; box-shadow: 4px 4px 0px #000;">&gt;&gt;</button>
            </div>
            <div class="prog-container">
                <span id="pCur">0:00</span>
                <div class="prog-track" onclick="app.seek(event)"><div class="prog-fill" id="pBar"></div></div>
                <span id="pDur">0:00</span>
            </div>
        </div>

        <div class="p-extra">
            <button onclick="app.likeCurrent()" class="b-btn" style="padding: 10px 20px; background: #fff; box-shadow: 4px 4px 0px #000; display: flex; gap: 10px; align-items: center;">
                LIKE <div id="mainLikeIcon" class="css-heart"></div>
            </button>
        </div>

    </footer>

    <script>
        const DB_KEY = 'aura_brutal_db';
        const SESSION_KEY = 'aura_brutal_session';

        const app = {
            session: JSON.parse(localStorage.getItem(SESSION_KEY)),
            likes: new Set(),
            view: 'all',
            idx: -1,
            list: [],
            playing: false,
            sec: 0,
            dur: 0,
            timer: null,

            init() {
                if (!this.session) window.location.href = 'login.html';
                document.getElementById('uName').innerText = this.session.name;
                const saved = localStorage.getItem(`aura_b_likes_${this.session.email}`);
                if (saved) this.likes = new Set(JSON.parse(saved));
                this.render();
            },

            setView(v) {
                this.view = v;
                document.getElementById('nav-all').className = `nav-btn ${v === 'all' ? 'active' : ''}`;
                document.getElementById('nav-liked').className = `nav-btn ${v === 'liked' ? 'active' : ''}`;
                document.getElementById('vTitle').innerText = v === 'all' ? 'CATALOG_' : 'LIKED_';
                this.render();
            },

            render() {
                const db = JSON.parse(localStorage.getItem(DB_KEY)) || { songs: [] };
                const q = document.getElementById('search').value.toLowerCase();
                
                this.list = db.songs.reverse().filter(s => {
                    const mQ = s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
                    const mV = this.view === 'all' || this.likes.has(s.id);
                    return mQ && mV;
                });

                const g = document.getElementById('grid');
                if (this.list.length === 0) {
                    g.innerHTML = `<div style="font-family: 'Space Mono'; font-weight: 700; color: #888; font-size: 1.2rem; margin-top: 40px;">// NO_RESULTS_FOUND</div>`;
                    return;
                }

                g.innerHTML = this.list.map((s, i) => `
                    <div class="card" onclick="app.play(${i})">
                        <div class="card-img-box"><img src="${s.cover}"></div>
                        <div class="card-title">${s.title}</div>
                        <div class="card-artist">${s.artist}</div>
                        <div class="card-bottom">
                            <button class="b-btn" style="background: #ffe600; padding: 5px 15px; font-size: 0.8rem; box-shadow: 2px 2px 0px #000; color: #000;" onclick="event.stopPropagation(); app.play(${i})">PLAY</button>
                            <div class="css-heart ${this.likes.has(s.id) ? 'filled' : ''}" style="color: ${this.likes.has(s.id) ? 'var(--primary)' : 'currentColor'}"></div>
                        </div>
                    </div>
                `).join('');
            },

            play(i) {
                this.idx = i;
                const s = this.list[i];
                document.getElementById('pImg').src = s.cover;
                document.getElementById('pImg').style.display = 'block';
                document.getElementById('pTitle').innerText = s.title;
                document.getElementById('pArt').innerText = s.artist;
                
                const timeParts = s.duration.split(':');
                this.dur = parseInt(timeParts[0])*60 + parseInt(timeParts[1] || 0);
                document.getElementById('pDur').innerText = s.duration;
                
                this.sec = 0;
                this.updateUI();
                
                const heart = document.getElementById('mainLikeIcon');
                if (this.likes.has(s.id)) {
                    heart.classList.add('filled');
                    heart.style.color = 'var(--primary)';
                } else {
                    heart.classList.remove('filled');
                    heart.style.color = 'currentColor';
                }

                if (!this.playing) this.togglePlay();
            },

            togglePlay() {
                if (this.idx === -1 && this.list.length > 0) return this.play(0);
                if (this.idx === -1) return;

                this.playing = !this.playing;
                const btn = document.getElementById('playBtn');

                if (this.playing) {
                    btn.innerHTML = '<div class="icon-pause"><div></div><div></div></div>';
                    this.timer = setInterval(() => {
                        this.sec++;
                        if (this.sec >= this.dur) this.skip(1);
                        else this.updateUI();
                    }, 1000);
                } else {
                    btn.innerHTML = '<div class="icon-play"></div>';
                    clearInterval(this.timer);
                }
            },

            skip(dir) {
                if (this.list.length === 0) return;
                let next = this.idx + dir;
                if (next >= this.list.length) next = 0;
                if (next < 0) next = this.list.length - 1;
                this.play(next);
            },

            seek(e) {
                if (this.dur === 0) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                this.sec = Math.floor(this.dur * pct);
                this.updateUI();
            },

            updateUI() {
                const m = Math.floor(this.sec / 60);
                const s = this.sec % 60;
                document.getElementById('pCur').innerText = `${m}:${s<10?'0':''}${s}`;
                document.getElementById('pBar').style.width = `${(this.sec/this.dur)*100}%`;
            },

            likeCurrent() {
                if (this.idx === -1) return;
                const id = this.list[this.idx].id;
                
                if (this.likes.has(id)) this.likes.delete(id);
                else this.likes.add(id);
                
                localStorage.setItem(`aura_b_likes_${this.session.email}`, JSON.stringify([...this.likes]));
                this.render();
                
                const heart = document.getElementById('mainLikeIcon');
                if (this.likes.has(id)) {
                    heart.classList.add('filled');
                    heart.style.color = 'var(--primary)';
                } else {
                    heart.classList.remove('filled');
                    heart.style.color = 'currentColor';
                }
            },

            logout() {
                localStorage.removeItem(SESSION_KEY);
                window.location.href = 'login.html';
            }
        };

        app.init();
    </script>
</body>
</html>
