<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; --sidebar-bg: rgba(28, 28, 30, 0.5); --player-bg: rgba(30, 30, 30, 0.75);
            --border: rgba(255, 255, 255, 0.1); --accent: #fa243c;
            --text-main: #ffffff; --text-muted: rgba(235, 235, 245, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        .ambient-bg { position: absolute; inset: 0; z-index: -1; filter: blur(100px); opacity: 0.4; transition: 1s ease; pointer-events: none; background-size: cover; background-position: center; }

        .workspace { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 260px; background: var(--sidebar-bg); backdrop-filter: blur(50px); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px 15px; z-index: 10; }
        .search-box { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 25px; display: flex; align-items: center; gap: 8px; }
        .search-box svg { fill: var(--text-muted); width: 14px; height: 14px; }
        .search-box input { background: transparent; border: none; color: #fff; width: 100%; font-size: 13px; outline: none; }
        
        .nav-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin: 15px 0 5px 10px; }
        .nav-btn { width: 100%; background: transparent; border: none; color: var(--text-main); text-align: left; padding: 8px 10px; font-size: 14px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-bottom: 2px; display: flex; align-items: center; gap: 10px; }
        .nav-btn:hover { background: rgba(255,255,255,0.05); }
        .nav-btn.active { background: rgba(255,255,255,0.1); color: var(--accent); font-weight: 600; }
        .svg-icon { width: 18px; height: 18px; fill: currentColor; }

        .user-box { margin-top: auto; padding: 15px 10px 0 10px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .u-name { font-size: 13px; font-weight: 600; }
        .logout-btn { background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { color: #ff453a; }

        /* MAIN AREA */
        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%); }
        .header { padding: 40px 50px 20px 50px; }
        .view-title { font-size: 34px; font-weight: 700; letter-spacing: -1px; margin-bottom: 5px; }
        
        .grid-wrap { flex: 1; overflow-y: auto; padding: 10px 50px 100px 50px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        
        .card { cursor: pointer; transition: 0.3s; }
        .card:hover .cover-wrap { transform: scale(1.03); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .cover-wrap { position: relative; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s; }
        .cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .play-overlay { position: absolute; right: 10px; bottom: 10px; opacity: 0; transition: 0.3s; transform: translateY(10px); }
        .card:hover .play-overlay { opacity: 1; transform: translateY(0); }
        .play-btn-circle { width: 40px; height: 40px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .card-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-artist { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Custom Views HTML (Browse / Radio) */
        .hero-banner { grid-column: 1 / -1; height: 250px; border-radius: 16px; background: linear-gradient(135deg, #fa233b, #5e5ce6); display: flex; align-items: flex-end; padding: 30px; margin-bottom: 10px; position: relative; overflow: hidden; cursor: pointer; }
        .hero-banner::after { content: ''; position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=1000&q=80') center/cover; mix-blend-mode: overlay; opacity: 0.4; }
        .hero-banner h3 { font-size: 32px; font-weight: 700; z-index: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .radio-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid var(--border); transition: 0.3s; cursor: pointer; }
        .radio-card:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .radio-icon { width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }

        /* PLAYER BAR */
        .player-bar { background: var(--player-bg); backdrop-filter: blur(50px) saturate(200%); -webkit-backdrop-filter: blur(50px) saturate(200%); border-top: 1px solid var(--border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        
        .p-info { display: flex; align-items: center; gap: 15px; width: 30%; }
        .p-cover { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: rgba(255,255,255,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.5s; opacity: 0.3; }
        .p-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
        .p-artist { font-size: 12px; color: var(--text-muted); }

        .p-controls { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 600px; }
        .ctrl-btns { display: flex; align-items: center; gap: 25px; margin-bottom: 10px; }
        
        .btn-transport { background: transparent; border: none; color: #fff; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-transport:hover { opacity: 0.7; }
        .btn-main { width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; }
        .btn-main:hover { transform: scale(1.05); opacity: 1; }

        .prog-wrap { width: 100%; display: flex; align-items: center; gap: 15px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .prog-track { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
        .prog-fill { background: #fff; height: 100%; width: 0%; border-radius: 2px; transition: width 0.1s linear; }

        .p-extra { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 15px; }
        .btn-like { background: transparent; border: none; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; }
        .btn-like:hover { transform: scale(1.1); }
        .btn-like.liked { color: var(--accent); }

        /* Pure CSS Icons */
        .icon-play { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid currentColor; margin-left: 3px; }
        .icon-pause { display: flex; gap: 3px; }
        .icon-pause div { width: 3px; height: 12px; background: currentColor; border-radius: 1px; }
        .icon-skip-f { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid currentColor; position: relative; }
        .icon-skip-f::after { content: ''; position: absolute; right: -10px; top: -5px; width: 2px; height: 10px; background: currentColor; }
        .icon-skip-b { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 8px solid currentColor; position: relative; }
        .icon-skip-b::before { content: ''; position: absolute; left: -10px; top: -5px; width: 2px; height: 10px; background: currentColor; }
        .svg-heart { width: 18px; height: 18px; fill: currentColor; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; border: 2px solid var(--bg-color); }
    </style>
</head>
<body>

    <div class="ambient-bg" id="ambientBg"></div>

    <div class="workspace">
        <aside class="sidebar">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="search" placeholder="Search" oninput="app.render()">
            </div>

            <div class="nav-label">Apple Music</div>
            <button onclick="app.setView('all')" id="nav-all" class="nav-btn active">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg> Listen Now
            </button>
            <button onclick="app.setView('browse')" id="nav-browse" class="nav-btn">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg> Browse
            </button>
            <button onclick="app.setView('radio')" id="nav-radio" class="nav-btn">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-.83-.51-1.57-1.24-1.85L12 2 3.24 6.15zM4 10h16v10H4V10zm8-2l7.46 3.54H4.54L12 8z"/></svg> Radio
            </button>

            <div class="nav-label" style="margin-top: 20px;">Library</div>
            <button onclick="app.setView('recent')" id="nav-recent" class="nav-btn">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg> Recently Added
            </button>
            <button onclick="app.setView('liked')" id="nav-liked" class="nav-btn">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> Liked Songs
            </button>

            <div class="user-box">
                <div class="u-name" id="uName">User</div>
                <button onclick="app.logout()" class="logout-btn">Sign Out</button>
            </div>
        </aside>

        <main class="main-area">
            <div class="header">
                <h2 class="view-title" id="vTitle">Listen Now</h2>
            </div>
            <div class="grid-wrap custom-scroll">
                <div class="grid-container" id="grid"></div>
            </div>
        </main>
    </div>

    <!-- PLAYER -->
    <footer class="player-bar">
        <div class="p-info">
            <img id="pImg" src="" class="p-cover">
            <div style="min-width: 0;">
                <div class="p-title" id="pTitle">Not Playing</div>
                <div class="p-artist" id="pArt"></div>
            </div>
        </div>

        <div class="p-controls">
            <div class="ctrl-btns">
                <button onclick="app.skip(-1)" class="btn-transport"><div class="icon-skip-b"></div></button>
                <button onclick="app.togglePlay()" id="playBtn" class="btn-transport btn-main"><div class="icon-play" style="color:black;"></div></button>
                <button onclick="app.skip(1)" class="btn-transport"><div class="icon-skip-f"></div></button>
            </div>
            <div class="prog-wrap">
                <span id="pCur">0:00</span>
                <div class="prog-track" onclick="app.seek(event)"><div class="prog-fill" id="pBar"></div></div>
                <span id="pDur">-:--</span>
            </div>
        </div>

        <div class="p-extra">
            <button onclick="app.likeCurrent()" class="btn-like" id="likeBtn" style="opacity: 0; pointer-events: none;">
                <svg class="svg-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
        </div>
    </footer>

    <script>
        const DB_KEY = 'aura_am_final_db';
        const SESSION_KEY = 'aura_am_final_session';

        const app = {
            session: JSON.parse(localStorage.getItem(SESSION_KEY)),
            likes: new Set(),
            view: 'all',
            idx: -1,
            list: [],
            playing: false,
            sec: 0,
            dur: 0,
            timer: null,

            init() {
                if (!this.session) window.location.href = 'login.html';
                document.getElementById('uName').innerText = this.session.name;
                const saved = localStorage.getItem(`aura_am_likes_${this.session.email}`);
                if (saved) this.likes = new Set(JSON.parse(saved));
                this.render();
            },

            setView(v) {
                this.view = v;
                // Update Sidebar Active States
                ['all', 'browse', 'radio', 'recent', 'liked'].forEach(id => {
                    document.getElementById(`nav-${id}`).classList.remove('active');
                });
                document.getElementById(`nav-${v}`).classList.add('active');
                
                // Set Header Title
                const titles = { 'all': 'Listen Now', 'browse': 'Browse', 'radio': 'Radio', 'recent': 'Recently Added', 'liked': 'Songs' };
                document.getElementById('vTitle').innerText = titles[v];
                
                this.render();
            },

            render() {
                const db = JSON.parse(localStorage.getItem(DB_KEY)) || { songs: [] };
                const q = document.getElementById('search').value.toLowerCase();
                const g = document.getElementById('grid');
                
                // Custom View Layouts inside the SPA to avoid music cutting off
                if (this.view === 'browse' && q === '') {
                    g.innerHTML = `
                        <div class="hero-banner" onclick="app.play(0)"><h3>Top 100: Tollywood</h3></div>
                        <div class="hero-banner" style="background: linear-gradient(135deg, #10b981, #3b82f6);" onclick="app.play(3)"><h3>New Releases</h3></div>
                    `;
                    return;
                }
                
                if (this.view === 'radio' && q === '') {
                    g.innerHTML = `
                        <div class="radio-card" onclick="app.play(0)">
                            <div class="radio-icon"><div class="icon-play" style="color:white; margin-left:4px;"></div></div>
                            <h4 style="font-weight: 600; margin-bottom: 4px;">Aura 1</h4>
                            <p style="font-size: 12px; color: var(--text-muted);">The new music station.</p>
                        </div>
                        <div class="radio-card" onclick="app.play(2)">
                            <div class="radio-icon" style="background:#5e5ce6;"><div class="icon-play" style="color:white; margin-left:4px;"></div></div>
                            <h4 style="font-weight: 600; margin-bottom: 4px;">Tollywood Hits</h4>
                            <p style="font-size: 12px; color: var(--text-muted);">Blockbuster tracks non-stop.</p>
                        </div>
                    `;
                    return;
                }

                // Standard Grid Views (All, Liked, Recent)
                let baseList = db.songs.reverse();
                if (this.view === 'recent' && q === '') baseList = baseList.slice(0, 5); // Just show newest 5
                
                this.list = baseList.filter(s => {
                    const mQ = s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
                    const mV = (this.view === 'all' || this.view === 'browse' || this.view === 'radio' || this.view === 'recent') || this.likes.has(s.id);
                    return mQ && mV;
                });

                if (this.list.length === 0) {
                    g.innerHTML = `<div style="color: var(--text-muted); font-size: 14px;">No music found.</div>`;
                    return;
                }

                g.innerHTML = this.list.map((s, i) => `
                    <div class="card" onclick="app.play(${i})">
                        <div class="cover-wrap">
                            <img src="${s.cover}">
                            <div class="play-overlay"><div class="play-btn-circle"><div class="icon-play" style="color:white;"></div></div></div>
                        </div>
                        <div class="card-title">${s.title}</div>
                        <div class="card-artist">${s.artist}</div>
                    </div>
                `).join('');
            },

            play(i) {
                this.idx = i;
                const s = this.list[i];
                
                document.getElementById('pImg').src = s.cover;
                document.getElementById('pImg').style.opacity = '1';
                document.getElementById('ambientBg').style.backgroundImage = `url(${s.cover})`;
                
                document.getElementById('pTitle').innerText = s.title;
                document.getElementById('pArt').innerText = s.artist;
                
                const timeParts = s.duration.split(':');
                this.dur = parseInt(timeParts[0])*60 + parseInt(timeParts[1] || 0);
                document.getElementById('pDur').innerText = s.duration;
                
                this.sec = 0;
                this.updateUI();
                
                const likeBtn = document.getElementById('likeBtn');
                likeBtn.style.opacity = '1';
                likeBtn.style.pointerEvents = 'auto';
                likeBtn.className = `btn-like ${this.likes.has(s.id) ? 'liked' : ''}`;

                if (!this.playing) this.togglePlay();
            },

            togglePlay() {
                if (this.idx === -1 && this.list.length > 0) return this.play(0);
                if (this.idx === -1) return;

                this.playing = !this.playing;
                const btn = document.getElementById('playBtn');

                if (this.playing) {
                    btn.innerHTML = '<div class="icon-pause" style="color:black;"><div></div><div></div></div>';
                    this.timer = setInterval(() => {
                        this.sec++;
                        if (this.sec >= this.dur) this.skip(1);
                        else this.updateUI();
                    }, 1000);
                } else {
                    btn.innerHTML = '<div class="icon-play" style="color:black;"></div>';
                    clearInterval(this.timer);
                }
            },

            skip(dir) {
                if (this.list.length === 0) return;
                let next = this.idx + dir;
                if (next >= this.list.length) next = 0;
                if (next < 0) next = this.list.length - 1;
                this.play(next);
            },

            seek(e) {
                if (this.dur === 0) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                this.sec = Math.floor(this.dur * pct);
                this.updateUI();
            },

            updateUI() {
                const m = Math.floor(this.sec / 60);
                const s = this.sec % 60;
                document.getElementById('pCur').innerText = `${m}:${s<10?'0':''}${s}`;
                document.getElementById('pBar').style.width = `${(this.sec/this.dur)*100}%`;
            },

            likeCurrent() {
                if (this.idx === -1) return;
                const id = this.list[this.idx].id;
                
                if (this.likes.has(id)) this.likes.delete(id);
                else this.likes.add(id);
                
                localStorage.setItem(`aura_am_likes_${this.session.email}`, JSON.stringify([...this.likes]));
                this.render();
                document.getElementById('likeBtn').className = `btn-like ${this.likes.has(id) ? 'liked' : ''}`;
            },

            logout() {
                document.body.style.transition = "opacity 0.5s ease"; document.body.style.opacity = 0;
                setTimeout(() => { localStorage.removeItem(SESSION_KEY); window.location.href = 'login.html'; }, 500);
            }
        };

        app.init();
    </script>
</body>
</html>
